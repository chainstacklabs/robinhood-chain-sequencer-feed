# Offchain Labs' own relay binary, pointed at Robinhood Chain.
#
#   docker compose up -d --wait relay     # blocks until the relay is serving
#   rhfeed
#
# If it never becomes healthy, or it is healthy and `rhfeed` still shows
# nothing, the answer is in `docker compose logs relay` — "Feed connected" means the
# upstream is good, repeated "failed connect to sequencer broadcast" means it is not.
#
# `entrypoint: relay` selects a different binary from the nitro-node image: it holds
# one upstream WebSocket and re-serves it, with no sync, no execution and no
# database. Measured against this chain, idle with no consumers attached, it sits at
# 28-41 MB of memory and ~1% of a core, and writes nothing to disk (0 bytes to the
# block device, 4 kB of writable layer). Attached consumers push memory higher — a
# handful of CLI sessions took it to ~71 MB — which is what the 512m cap is for.
#
# Consumers — including full Nitro nodes via --node.feed.input.url — connect to
# ws://<host>:9642 and share this one upstream connection. That matters because the
# public feed rate-limits per client, not per connection.

services:
  relay:
    # The newest nitro whose source can be read. v3.11.4 was tagged 2026-09-16 at commit
    # 7d5ac27 — the same commit mainnet was answering `web3_clientVersion` with two days
    # earlier, so what runs here is now the sequencer's own code rather than an image
    # with nothing behind it.
    #
    # Nothing the decoder or the README rests on moved across the 57 commits from
    # v3.11.3: `arbos/parse_l2.go`, `util/signature/verifier.go`,
    # `broadcaster/message/message.go`, `broadcastclient/broadcastclient.go`,
    # `wsbroadcastserver/clientconnection.go` and `broadcaster/broadcaster.go` are all
    # byte-identical between the two tags. The release is Stylus, BoLD and batch-poster
    # work; the feed protocol is untouched.
    #
    # Mainnet has since moved on to v3.12.0-rc.2+19e94c6 (checked 2026-09-17), which is
    # not public: no tag, no commit and no image anywhere. A relay only has to speak the
    # feed protocol, so there is nothing to chase.
    image: offchainlabs/nitro-node:v3.11.4-7d5ac27
    entrypoint: relay
    restart: unless-stopped
    ports:
      # Bound to localhost. Publish it wider only behind your own network controls —
      # the relay has no authentication of its own.
      - "127.0.0.1:9642:9642"
    command:
      - --node.feed.output.addr=0.0.0.0
      - --node.feed.input.url=wss://feed.mainnet.chain.robinhood.com
      - --chain.id=4663
      # Both of these are already the defaults. They are spelled out because the
      # combination is the whole reason to run a relay: it reads the compressed public
      # feed and re-serves plain JSON, so nothing downstream needs a deflate-capable
      # WebSocket client. Leaving them implicit hides that.
      #
      # Compressed upstream. Mandatory on the public feed since 2026-09-17.
      - --node.feed.input.enable-compression=true
      # Uncompressed downstream. Do not turn this on unless your consumers speak
      # Nitro's dialect, which is not plain RFC 7692 — see the README. It also puts
      # level-9 deflate on the relay's broadcast path for every message.
      - --node.feed.output.enable-compression=false
    # The relay holds everything in memory and needs very little of it.
    mem_limit: 512m
    # The broadcaster answers a plain GET with "400 handshake error: bad Upgrade
    # header", which is enough to prove it is listening and serving. curl without -f
    # treats a 400 as success, which is what we want here.
    #
    # This says the local server is up. It does *not* say the upstream feed is
    # connected — nothing the relay exposes does. `rhfeed` warns about that
    # case itself after 30 quiet seconds.
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "--max-time", "3", "http://127.0.0.1:9642/"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
